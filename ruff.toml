line-length = 100
target-version = "py313"

[format]
quote-style = "double"

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
]
ignore = [
    "B008",  # FastAPI dependency injection uses Query()/Depends() in defaults (idiomatic)
    "N818",  # domain exception names intentionally omit the Error suffix (e.g. InsufficientStock)
]
