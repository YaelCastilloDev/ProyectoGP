[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ferreteria-multitienda"
version = "0.1.0"
description = "Multi-store hardware chain: shared inventory, purchase flow and hybrid recommendation system (POC)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.128.7",
    "uvicorn[standard]>=0.39.0",
    "tortoise-orm>=1.1.8",
    "aiosqlite>=0.20.0",
    "aerich>=0.8.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "opentelemetry-api>=1.39.0",
    "opentelemetry-sdk>=1.39.0",
    "opentelemetry-instrumentation-fastapi>=0.60b0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.aerich]
tortoise_orm = "backend.app.infrastructure.db.tortoise_models.TORTOISE_ORM"
location = "./backend/migrations"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
